services:
  app:
    build: .
    # PORT sets the port on this machine. The app still listens on port 3000 inside Docker.
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    # Pass the settings from the Compose environment to the app container.
    environment:
      PORT: 3000
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/taskflow}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    # Wait for MongoDB to answer its health check before starting the app.
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:8.0
    # Keep MongoDB data in a named volume so it survives container replacement.
    volumes:
      - taskflow-data:/data/db
    # A successful database ping tells Compose that MongoDB is ready.
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ ping: 1 }).ok === 1 ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  taskflow-data:
