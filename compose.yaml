services:
  app:
    build: .
    # PORT sets the port on this machine. The app still listens on port 3000 inside Docker.
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    # Pass the settings from the Compose environment to the app container.
    environment:
      PORT: 3000
      MONGODB_URI: ${MONGODB_URI:?Set the Atlas connection string in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY: ${TRUST_PROXY:-true}
